# Application
spring.application.name=api-gateway
server.port=8080

# Eureka - gateway juga daftar ke eureka + tanya alamat service dari sini
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===== ROUTING =====
# Rute 0: semua request berawalan /api/auth/** diteruskan ke auth-service
# lb:// = load-balanced: tanya Eureka "auth-service di mana?", bukan hardcode port
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Rute 1: /api/users/** → user-service (prefix unik, tidak bentrok dengan rute 0)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# ===== API DOCS =====
# Rute spec: /docs/specs/xxx → /v3/api-docs milik tiap service (SetPath = tulis ulang path)
spring.cloud.gateway.routes[2].id=auth-service-docs
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/docs/specs/auth
spring.cloud.gateway.routes[2].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[3].id=user-service-docs
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/docs/specs/users
spring.cloud.gateway.routes[3].filters[0]=SetPath=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
