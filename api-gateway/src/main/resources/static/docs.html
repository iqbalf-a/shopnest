<!doctype html>
<html>
<head>
    <title>ShopNest API Documentation</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
    <div id="app"></div>

    <!-- Scalar UI - dimuat browser dari CDN, membaca spec dari rute /docs/specs/* -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
        Scalar.createApiReference('#app', {
            sources: [
                { url: '/docs/specs/auth',     title: 'Auth Service' },
                { url: '/docs/specs/users',    title: 'User Service' },
                { url: '/docs/specs/products', title: 'Product Service' },
                { url: '/docs/specs/orders',   title: 'Order Service' }
            ]
        })
    </script>
</body>
</html>
